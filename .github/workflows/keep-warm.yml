name: Keep Render backend warm

# OPTIONAL. Pings your backend's /health endpoint every 7 minutes, 07:00-18:50 UTC,
# so a free-tier Render instance is not asleep when visitors arrive. Edit the cron
# window to match when your audience is awake.
#
# It does nothing until you add a repository variable named BACKEND_URL
# (Settings -> Secrets and variables -> Actions -> Variables), e.g.
#   https://your-backend.onrender.com
# Delete this file if you host the backend somewhere that does not sleep.
on:
  schedule:
    - cron: "*/7 7-18 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    if: ${{ vars.BACKEND_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        # A request can hit Render mid cold-start and get nothing back before the
        # free instance finishes booting, so retry with a generous timeout.
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          for attempt in 1 2 3 4; do
            if curl -fsS --max-time 60 "$BACKEND_URL/health"; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          exit 1
